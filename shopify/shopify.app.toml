# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "19d42795913d92ee245ec090b27d7ebd"
name = "AgentFlow"
application_url = "https://agentflow-beige-eight.vercel.app"
embedded = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Store Bootstrap uses the Admin GraphQL productSet query/mutation. Inventory
# remains Shopify-owned by default, so write_inventory is intentionally omitted.
scopes = "read_products,write_products"

[app_proxy]
url = "https://agentflow-beige-eight.vercel.app/api/shopify/proxy"
prefix = "apps"
subpath = "agentflow"

[auth]
redirect_urls = [ "https://agentflow-beige-eight.vercel.app/", "https://agentflow-beige-eight.vercel.app/api/shopify/auth/callback" ]

[webhooks]
api_version = "2026-10"

[build]
automatically_update_urls_on_dev = true
